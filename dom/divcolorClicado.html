<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Clicado</title>
  </head>
  <body>
    <style>
      #padre {
        width: 500px;
        height: 500px;
        border: 3px solid black;
      }
      div .hijo {
        width: 100px;
        height: 100px;
      }
      div #hijo1 {
        background-color: aqua;
      }
      div #hijo2 {
        background-color: red;
      }
      div #hijo3 {
        background-color: blue;
      }
    </style>
    <div id="padre">
      <div class="hijo" id="hijo1"></div>
      <div class="hijo" id="hijo2"></div>
      <div class="hijo" id="hijo3"></div>
    </div>

    <script>
        //coges el elemento donde quieres hacer un evento.
      const divPadre = document.querySelector("#padre");
      // creas la funcion del evento. Con target es el seleccionado en ese momento.
      function cambiarColorPadre(event) {
        const colorClicado = getComputedStyle(event.target).backgroundColor;
        //assignas el colorseleccionado al elemento que has cogido.
        divPadre.style.backgroundColor=colorClicado; // con getComputed acced al style de css, no inline.
      }
      //añades el evento al elemento --> evento en cuestion y la funcion)
      divPadre.addEventListener("click", cambiarColorPadre);
    </script>
  </body>
</html>
