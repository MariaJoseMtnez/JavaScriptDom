<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <input type="number" id="num1" placeholder="Número 1" />
    <input type="number" id="num2" placeholder="Número 2" />
    <select id="operacion">
      <option value="sumar">Sumar</option>
      <option value="restar">Restar</option>
      <option value="multiplicar">Multiplicar</option>
      <option value="dividir">Dividir</option>
    </select>
    <button id="calcular">Calcular</button>
    <p id="resultado"></p>

    <script>
      const num1 = document.querySelector("#num1");
      const num2 = document.querySelector("#num2");
      const boton = document.querySelector("#calcular");
      const resultado = document.querySelector("#resultado");
      const operacion = document.querySelector("#operacion");

      boton.addEventListener("click", () => {
        const a = parseFloat(num1.value);
        const b = parseFloat(num2.value);
        const op = operacion.value;

        if (isNaN(a) || isNaN(b)) {
          resultado.textContent = "Campos vacíos";
          return
        }
        if (b === 0 && op === "dividir") {
          resultado.textContent = `No se puede dividir por cero`;
          return;
        }

        if (op === "sumar") {
          resultado.textContent = `La suma es ${a + b}`;
          return;
        }
        if (op === "restar") {
          resultado.textContent = `La resta es ${a - b}`;
          return;
        }
        if (op === "dividir") {
          resultado.textContent = `La división es ${a / b}`;
          return;
        }
        if (op === "multiplicar") {
          resultado.textContent = `La multiplicación es ${a * b}`;
          return;
        }
      });
    </script>
  </body>
</html>
